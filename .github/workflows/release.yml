name: Release

on:
  push:
    tags: ["v*"]
  # Ручной запуск для уже существующего тега (собрать/дополнить релиз задним числом).
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег для сборки релиза (напр. v0.2.6)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # push-тега — берём его ref; ручной запуск — указанный тег.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag name
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install Windows target + mingw + GUI build deps
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update -qq
          # calc-notepad (eframe/egui + rfd) требует эти dev-заголовки для сборки на Linux-раннере.
          sudo apt-get install -y mingw-w64 \
            libgtk-3-dev libxkbcommon-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Test (gate the release)
        run: cargo test --workspace --all-targets

      - name: Build Linux (x86_64)
        run: cargo build --release -p calc-cli
      - name: Build Windows (x86_64)
        run: cargo build --release --target x86_64-pc-windows-gnu -p calc-cli
      - name: Build Linux notepad
        run: cargo build --release -p calc-notepad
      - name: Build Windows notepad
        run: cargo build --release --target x86_64-pc-windows-gnu -p calc-notepad

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/release/calc dist/calc-linux-x64
          cp target/x86_64-pc-windows-gnu/release/calc.exe dist/calc.exe
          cp target/release/calc-notepad dist/calc-notepad-linux-x64
          cp target/x86_64-pc-windows-gnu/release/calc-notepad.exe dist/calc-notepad.exe
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/calc-linux-x64
            dist/calc.exe
            dist/calc-notepad-linux-x64
            dist/calc-notepad.exe
